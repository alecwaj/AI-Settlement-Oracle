# Phala Cloud (dstack, Intel TDX) deployment for the AI Settlement Oracle.
#
#   phala login
#   phala deploy -n ai-settlement-oracle -c deploy/phala/docker-compose.yml -e deploy/phala/.env --wait
#
# Two enclaves, one chain of evidence:
#   1. This CVM (Intel TDX via dstack) runs the oracle + TEErminator. Everything in this file is measured:
#      its hash is the app's compose_hash (RTMR3), reported by GET /attestation.
#   2. Inference runs in Confidential AI's TDX + NVIDIA confidential-GPU enclaves. TEErminator, inside
#      this CVM, attests that upstream before forwarding any prompt, using the pins in
#      TEERMINATOR_REMOTE_ARGS below. Because those pins live in this measured file, a verifier of (1)
#      learns exactly which inference policy the oracle enforces.
#
# Secrets passed with `-e` (CONFIDENTIAL_API_KEY, RPC_URL) are encrypted client-side to the CVM's KMS key.
# Replace the image tag with the immutable digest you pushed (…/ai-settlement-oracle@sha256:…) before a
# production deploy.
services:
  oracle:
    image: ghcr.io/alecwaj/ai-settlement-oracle:1.1.0
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - oracle-data:/data
    environment:
      TEE_MODE: dstack
      LLM_MODE: confidential
      CONFIDENTIAL_MODEL: deepseek-ai/DeepSeek-V4.1-Flash-1017
      # Launch mode. "false" = UNVERIFIED inference: calls Confidential AI directly until their reviewed pins
      # are filled in below (the UI and every resolution record say so). Once the REPLACE_WITH_ values are
      # filled in, set this to "true": TEErminator then verifies the inference enclave before any prompt is
      # sent, and the container refuses to start unless that check passes.
      REQUIRE_ATTESTED_INFERENCE: "false"
      CONFIDENTIAL_UPSTREAM: https://api.confidential.ai/
      CONFIDENTIAL_PUBLIC_BASE: https://api.confidential.ai
      # Production pins for Confidential AI's front door (TEErminator `remote add` flags). Measurements are
      # mandatory: get the reviewed values for the current release from Confidential AI
      # (hello@confidential.ai) — TDX launch digest (MRTD, 96 hex), RTMR[1]/RTMR[2] (kernel + rootfs),
      # and the RTMR[3] seed. The container refuses to start while any REPLACE_WITH_ placeholder remains.
      # The allowlist digest was observed on 2026-11-09: that policy pins the inference workers to
      # deepseek-ai/DeepSeek-V4.1-Flash-1017 @ revision 1bae0e1088993b9b82de08f59de5be5a34e42170 and the
      # weight-index hash. It changes when Confidential AI ships a new release; re-review and update.
      TEERMINATOR_REMOTE_ARGS: >-
        --mode attest-lb --server-name api.confidential.ai
        --measurements REPLACE_WITH_MRTD
        --rtmr 1=REPLACE_WITH_RTMR1,2=REPLACE_WITH_RTMR2
        --expected-rtmr3 REPLACE_WITH_RTMR3
        --pin-policy sha256:251eaf57d70dda5b2f6e292bf898cb339993a81a99381d195d45f580708da113
        --tdx-tcb-status UpToDate
      CONFIDENTIAL_API_KEY: ${CONFIDENTIAL_API_KEY}
      RPC_URL: ${RPC_URL}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS}
      AUTO_SUBMIT: "true"
      # Public-demo safeguards for the operator's inference key.
      MAX_AI_CALLS_PER_DAY: "50"
      RESOLVE_RATE_LIMIT_PER_HOUR: "10"
      ALLOWED_ORIGINS: "*"            # or your Vercel URL, e.g. https://ai-settlement-oracle.vercel.app
      WATCH_INTERVAL_MS: "15000"
      DATA_DIR: /data

volumes:
  oracle-data:
