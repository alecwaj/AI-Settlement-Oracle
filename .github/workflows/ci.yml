name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build contracts
        working-directory: contracts
        run: forge build

      - name: Contract tests
        working-directory: contracts
        run: forge test -vv

      - name: Check generated ABI is up to date
        run: node scripts/export-abi.mjs && git diff --exit-code shared/src/abi.ts

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Includes the oracle's end-to-end pipeline test against a local Anvil chain.
      - name: Tests
        run: npm test

      - name: Build demo
        run: npm run build --workspace=demo
